[workspace]
resolver = "2"
members = ["avalonia", "avalonia-sys", "avalonia-bindgen"]
# templates/avalonia-app is a copyable starting point for new applications
# (see rust/new-app.ps1, rust/new-app.sh, rust/PRODUCTIZATION.md), not a
# member of this workspace: it is meant to be copied outside this repository
# with its own path dependency updated to point at a separate Avalonia
# checkout, so it must keep resolving as a standalone crate.
exclude = ["templates/avalonia-app"]
